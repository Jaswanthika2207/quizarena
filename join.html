<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuizArena — Join Game</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .join-layout { max-width:580px;width:100%;margin:0 auto;padding:32px 20px 60px; }
    .top-nav { display:flex;align-items:center;justify-content:space-between;margin-bottom:36px; }
    .nav-brand { font-family:'Orbitron',monospace;font-weight:900;font-size:1.5rem;
      background:linear-gradient(135deg,var(--primary),var(--secondary));
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text; }

    .join-card { background:var(--glass);border:1.5px solid var(--glass-border);border-radius:var(--radius);padding:36px;backdrop-filter:blur(20px); }
    .join-card h2 { font-family:'Orbitron',monospace;font-weight:700;font-size:1.4rem;margin-bottom:6px; }
    .join-card .subtitle { color:var(--text-dim);font-size:0.9rem;margin-bottom:28px; }

    .code-input {
      text-align:center; font-family:'Orbitron',monospace; font-weight:900;
      font-size:2rem; letter-spacing:8px; text-transform:uppercase;
      background:rgba(255,255,255,0.05); border:2px solid var(--glass-border);
      border-radius:var(--radius-sm); padding:16px; color:var(--gold);
    }
    .code-input:focus { border-color:var(--gold);outline:none; }

    .avatar-section { margin:28px 0; }
    .avatar-grid { display:grid;grid-template-columns:repeat(6,1fr);gap:10px;max-height:200px;overflow-y:auto;padding:4px; }
    .avatar-option {
      width:100%;aspect-ratio:1;border-radius:50%;display:flex;align-items:center;
      justify-content:center;font-size:1.6rem;cursor:pointer;
      border:2.5px solid transparent;transition:var(--transition);
    }
    .avatar-option.selected { border-color:#fff;box-shadow:0 0 0 3px var(--primary); transform:scale(1.1); }
    
    .color-grid { display:flex;gap:10px;flex-wrap:wrap;margin-top:12px; }
    .color-option { width:36px;height:36px;border-radius:50%;cursor:pointer;border:2.5px solid transparent; }
    .color-option.selected { border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,0.4); }

    .avatar-preview-wrap { display:flex;align-items:center;justify-content:center;margin:16px 0; }
    .avatar-preview {
      width:90px;height:90px;border-radius:50%;display:flex;align-items:center;
      justify-content:center;font-size:2.8rem;
      box-shadow:0 8px 30px rgba(0,0,0,0.4);border:3px solid rgba(255,255,255,0.2);
    }

    .lobby-wait { display:none; }
    .lobby-wait.active { display:block;animation:fadeIn 0.5s ease; }
    .join-form.hidden { display:none; }

    .lobby-players { display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:12px;margin-top:20px; }
    .lp-card { background:var(--glass);border:1px solid var(--glass-border);border-radius:var(--radius-sm);padding:14px;text-align:center; }
    .lp-card.me { border-color:var(--primary);background:rgba(124,92,252,0.1); }
  </style>
</head>
<body>
  <div class="bg-animated">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <div class="page-wrapper">
    <div class="join-layout animate-fadeIn">
      <div class="top-nav">
        <div class="nav-brand">QuizArena</div>
        <a href="index.html" class="btn btn-ghost btn-sm">← Back</a>
      </div>

      <!-- Join Form -->
      <div class="join-card join-form" id="join-form">
        <h2>🚀 Join Arena</h2>
        <p class="subtitle">Enter the 6-character room code from the host.</p>

        <div class="form-group" style="margin-bottom:20px;">
          <label class="form-label">Room Code</label>
          <input type="text" id="room-code" class="form-input code-input" placeholder="ABC123" maxlength="6" autocomplete="off" oninput="this.value=this.value.toUpperCase()" />
        </div>

        <div class="form-group" style="margin-bottom:24px;">
          <label class="form-label">Your Name</label>
          <input type="text" id="player-name" class="form-input" placeholder="Enter your display name…" maxlength="25" />
        </div>

        <div class="avatar-section">
          <h3>🎭 Select Avatar</h3>
          <div class="avatar-grid" id="avatar-grid"></div>

          <div style="margin-top:16px;">
            <label class="form-label" style="margin-bottom:10px;display:block;">Avatar Color</label>
            <div class="color-grid" id="color-grid"></div>
          </div>

          <div class="avatar-preview-wrap">
            <div class="avatar-preview" id="avatar-preview" style="background:linear-gradient(135deg,#7c5cfc,#a855f7);">🦊</div>
          </div>
        </div>

        <button class="btn btn-secondary btn-lg" style="width:100%;" onclick="joinRoom()">
          🎮 Join Game
        </button>
      </div>

      <!-- Lobby Wait Screen -->
      <div class="lobby-wait" id="lobby-wait">
        <div class="join-card" style="text-align:center;">
          <div class="avatar avatar-xl" id="my-avatar-display" style="margin:0 auto 20px;"></div>
          <h2 id="my-name-display" style="font-family:'Orbitron',monospace;font-size:1.4rem;margin-bottom:6px;">Player</h2>
          <div class="badge badge-green" style="margin-bottom:24px;">✅ Connected to Room</div>

          <div style="background:rgba(0,0,0,0.3);border-radius:var(--radius-sm);padding:16px;margin-bottom:20px;">
            <p style="color:var(--text-dim);font-size:0.85rem;margin-bottom:6px;">ROOM CODE</p>
            <div style="font-family:'Orbitron',monospace;font-size:1.8rem;font-weight:900;color:var(--gold);" id="joined-code">---</div>
          </div>

          <p style="color:var(--text-dim);margin-bottom:12px;">Waiting for the host to press <strong>Start Game</strong>…</p>

          <div style="margin-top:24px;">
            <h3 style="font-weight:600;font-size:0.95rem;margin-bottom:12px;text-align:left;">👥 Connected Players</h3>
            <div class="lobby-players" id="lobby-players"></div>
          </div>

          <button class="btn btn-ghost btn-sm" style="margin-top:24px;width:100%;" onclick="leaveRoom()">Leave Lobby</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <script src="js/mqtt-channel.js"></script>
  <script src="js/app.js"></script>
  <script>
    let playerData = null;
    let joinChannel = null;
    let selectedAvatar = QA.AVATARS[0];
    let selectedColor = QA.AVATAR_COLORS[0];
    let joinInterval = null;
    let redirecting = false;

    function buildAvatarGrid() {
      const grid = document.getElementById('avatar-grid');
      QA.AVATARS.forEach((a, i) => {
        const opt = document.createElement('div');
        opt.className = 'avatar-option' + (i===0?' selected':'');
        opt.textContent = a;
        opt.style.background = QA.AVATAR_COLORS[i % QA.AVATAR_COLORS.length];
        opt.onclick = () => {
          document.querySelectorAll('.avatar-option').forEach(x=>x.classList.remove('selected'));
          opt.classList.add('selected');
          selectedAvatar = a;
          updatePreview();
        };
        grid.appendChild(opt);
      });
    }

    function buildColorGrid() {
      const grid = document.getElementById('color-grid');
      QA.AVATAR_COLORS.forEach((c, i) => {
        const opt = document.createElement('div');
        opt.className = 'color-option' + (i===0?' selected':'');
        opt.style.background = c;
        opt.onclick = () => {
          document.querySelectorAll('.color-option').forEach(x=>x.classList.remove('selected'));
          opt.classList.add('selected');
          selectedColor = c;
          updatePreview();
        };
        grid.appendChild(opt);
      });
    }

    function updatePreview() {
      const preview = document.getElementById('avatar-preview');
      preview.textContent = selectedAvatar;
      preview.style.background = selectedColor;
    }

    function joinRoom() {
      const code = document.getElementById('room-code').value.trim().toUpperCase();
      const name = document.getElementById('player-name').value.trim();
      if (!code || code.length !== 6) { QA.toast('Enter a valid 6-character room code!','error'); return; }
      if (!name) { QA.toast('Enter your name!','error'); return; }

      playerData = {
        id: QA.genId(),
        name: name,
        avatar: selectedAvatar,
        avatarColor: selectedColor,
        roomCode: code,
        score: 0,
        powers: { freeze:1, double:1, shield:1 },
      };
      QA.setPlayer(playerData);

      joinChannel = QA.getChannel(code);
      joinChannel.onmessage = handleMessage;

      // Repeat broadcast every 1.5s until host acknowledges
      if (joinInterval) clearInterval(joinInterval);
      joinInterval = setInterval(() => {
        if (!redirecting) {
          QA.broadcast({
            type: 'player_join',
            playerId: playerData.id,
            name: name,
            avatar: selectedAvatar,
            avatarColor: selectedColor,
          });
        }
      }, 1500);

      // Initial Join Broadcast
      QA.broadcast({
        type: 'player_join',
        playerId: playerData.id,
        name: name,
        avatar: selectedAvatar,
        avatarColor: selectedColor,
      });

      // Request current room state
      QA.broadcast({ type: 'request_room' });

      document.getElementById('join-form').classList.add('hidden');
      document.getElementById('lobby-wait').classList.add('active');
      document.getElementById('joined-code').textContent = code;

      const avatarEl = document.getElementById('my-avatar-display');
      avatarEl.textContent = selectedAvatar;
      avatarEl.style.background = selectedColor;
      document.getElementById('my-name-display').textContent = name;

      QA.toast(`Connected, ${name}! 🎉`,'success');
    }

    function handleMessage(e) {
      const msg = e.data;
      if (!msg || redirecting) return;

      // Handle Game Start message
      if (msg.type === 'game_start' || (msg.type === 'player_list' && msg.status === 'playing')) {
        if (msg.questions && msg.questions.length) {
          redirecting = true;
          if (joinInterval) clearInterval(joinInterval);
          
          const gameData = { questions: msg.questions, basePoints: msg.basePoints || 1000 };
          localStorage.setItem('qa_game_data', JSON.stringify(gameData));
          
          QA.toast('Game is starting!', 'success');
          setTimeout(() => { window.location.href = 'game.html?role=player'; }, 300);
          return;
        }
      }

      if (msg.type === 'player_list' && msg.players) {
        renderLobbyPlayers(msg.players);
      }
    }

    function renderLobbyPlayers(players) {
      const container = document.getElementById('lobby-players');
      container.innerHTML = '';
      Object.values(players).forEach(p => {
        const card = document.createElement('div');
        card.className = 'lp-card' + (p.id === playerData?.id ? ' me' : '');
        card.innerHTML = `
          <div class="avatar avatar-sm" style="background:${p.avatarColor};margin:0 auto;">${p.avatar}</div>
          <div class="lp-name">${p.name}${p.id===playerData?.id?' (You)':''}</div>`;
        container.appendChild(card);
      });
    }

    function leaveRoom() {
      if (joinInterval) clearInterval(joinInterval);
      QA.clearAll();
      window.location.href = 'index.html';
    }

    window.addEventListener('load', () => {
      buildAvatarGrid();
      buildColorGrid();

      // Auto-join if room code is in URL (e.g. join.html?code=XYZ123)
      const urlCode = new URLSearchParams(window.location.search).get('code');
      if (urlCode) {
        document.getElementById('room-code').value = urlCode.toUpperCase();
      }
    });
  </script>
</body>
</html>
